name: Build TWRP for Mi 10 (umi)

on:
  # 允许手动触发编译
  workflow_dispatch:
  # 可选：当推送到特定分支时自动编译（可自定义）
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    # 限制运行时间（6小时）
    timeout-minutes: 360

    steps:
      - name: Checkout repository (仅用于保存工作流文件本身)
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip repo
          # 配置 git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-twrp-umi-11
          max-size: 5G

      - name: Initialize repo
        run: |
          mkdir -p twrp
          cd twrp
          # 使用 minimal-manifest-twrp 的 twrp-11.0 分支（对应 Android 11）
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-11.0 --depth=1

      - name: Add device tree to local manifest
        run: |
          cd twrp
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/umi.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/xiaomi/umi" name="simonsmh/android_device_xiaomi_umi" remote="github" revision="android-11.0-new" />
          </manifest>
          EOF

      - name: Sync source
        run: |
          cd twrp
          repo sync --force-sync --no-tags --no-clone-bundle -j$(nproc)

      - name: Set up build environment
        run: |
          cd twrp
          source build/envsetup.sh
          # 准备设备树（有时需要额外复制预编译内核等，这里假设设备树完整）
          # 如果有 proprietary 文件需要提取，需在此处处理（但 TWRP 通常不需要 vendor blobs）

      - name: Build recovery image
        run: |
          cd twrp
          # 选择目标
          lunch omni_umi-eng
          # 编译 recoveryimage，添加 ALLOW_MISSING_DEPENDENCIES 以应对最小化树
          mka recoveryimage ALLOW_MISSING_DEPENDENCIES=true
        env:
          CCACHE_EXEC: /usr/bin/ccache
          USE_CCACHE: 1
          CCACHE_DIR: /home/runner/.ccache

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-umi-${{ github.sha }}
          path: twrp/out/target/product/umi/recovery.img
          if-no-files-found: error
