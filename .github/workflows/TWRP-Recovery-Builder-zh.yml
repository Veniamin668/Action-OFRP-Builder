name: TWRP - Build

on:
  workflow_dispatch:
    inputs:
      manifest_repo_url:
        description: 'TWRP manifest 仓库地址'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
        type: choice
        options:
          - https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
          - https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

      manifest_branch_preset:
        description: '选择常用的 manifest 分支（若选“自定义”，请在下方输入）'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-14.1
          - twrp-14
          - twrp-12.1
          - twrp-11
          - twrp-10.0-deprecated
          - twrp-9.0
          - twrp-8.1
          - twrp-7.1
          - twrp-6.0
          - twrp-5.1
          - twrp-4.4-deprecated
          - 自定义

      manifest_branch_custom:
        description: '如果上面选择了“自定义”，请在此输入自定义分支名'
        required: false
        default: ''

      device_tree_repo_url:
        description: '设备树 GitHub 仓库地址'
        required: true
        default: 'https://github.com/Veniamin668/device_redmi_klein'
        type: string
      device_tree_branch:
        description: '设备树分支'
        required: true
        default: 'twrp'
        type: string
      device_tree_path:
        description: '设备树在源码中的存放路径'
        required: true
        default: 'device/xiaomi/missi'
        type: string

      lunch_target:
        description: 'lunch 目标'
        required: true
        default: 'twrp_klein-eng'
        type: string

      build_target:
        description: '请选择要编译的镜像（三个只能选一个）'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - vendor_boot
          - boot

      upload_zip:
        description: '是否上传 ZIP 刷机包（作为 Artifact）'
        required: true
        default: true
        type: boolean

      upload_release:
        description: '是否将产物同时上传到 GitHub Release（默认开启）'
        required: true
        default: true
        type: boolean

      apply_sprd_drm_patch:
        description: '是否应用展讯DRM显示修复补丁（解决展讯平台TWRP卡Logo无法显示UI的问题）'
        required: true
        default: false
        type: boolean

      apply_himax_touch_patch:
        description: '是否应用 Himax 触摸屏修复补丁（解决 Himax 触控不释放的问题）'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备编译环境
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: 清理磁盘空间
        uses: rokibhasansagar/slimhub_actions@main

      - name: 确定最终使用的 manifest 分支
        id: manifest_branch
        run: |
          if [[ "${{ github.event.inputs.manifest_branch_preset }}" == "自定义" ]]; then
            BRANCH="${{ github.event.inputs.manifest_branch_custom }}"
            if [[ -z "$BRANCH" ]]; then
              echo "❌ 错误：选择了“自定义”但未填写自定义分支名"
              exit 1
            fi
          else
            BRANCH="${{ github.event.inputs.manifest_branch_preset }}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "✅ 使用的 manifest 分支: $BRANCH"

      - name: 初始化 repo
        run: |
          mkdir -p twrp
          cd twrp
          repo init -u "${{ github.event.inputs.manifest_repo_url }}" \
            -b "${{ steps.manifest_branch.outputs.branch }}" --depth=1

      - name: 通过 local manifest 添加自定义设备树
        run: |
          cd twrp
          mkdir -p .repo/local_manifests
          
          DEVICE_TREE_URL="${{ github.event.inputs.device_tree_repo_url }}"
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
          DEVICE_TREE_PATH="${{ github.event.inputs.device_tree_path }}"
          DEVICE_TREE_BRANCH="${{ github.event.inputs.device_tree_branch }}"
          
          if [[ $DEVICE_TREE_URL =~ ^(https?://[^/]+)/(.*)$ ]]; then
            FETCH="${BASH_REMATCH[1]}"
            NAME="${BASH_REMATCH[2]}"
          elif [[ $DEVICE_TREE_URL =~ ^(git@[^:]+):(.*)$ ]]; then
            FETCH="${BASH_REMATCH[1]}:"
            NAME="${BASH_REMATCH[2]}"
          else
            echo "❌ 不支持的 URL 格式: $DEVICE_TREE_URL"
            exit 1
          fi
          
          cat > .repo/local_manifests/custom_device.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="custom" fetch="$FETCH" />
            <project path="$DEVICE_TREE_PATH" name="$NAME" remote="custom" revision="$DEVICE_TREE_BRANCH" />
          </manifest>
          EOF
          
          echo "✅ 已生成 local manifest"

      - name: 同步源码
        run: |
          cd twrp
          repo sync --force-sync --no-tags --no-clone-bundle -j$(nproc)

      - name: 应用展讯DRM显示修复补丁
        if: github.event.inputs.apply_sprd_drm_patch == 'true'
        run: |
          echo "📦 正在克隆展讯DRM补丁仓库..."
          git clone https://github.com/rtyutechstudio/unisoc-twrp-sourcecode_patch.git /tmp/sprd_patch
          
          TARGET_FILE="twrp/bootable/recovery/minuitwrp/graphics_drm.cpp"
          
          if [ -f "$TARGET_FILE" ]; then
            echo "🗑️ 删除原 graphics_drm.cpp..."
            rm -f "$TARGET_FILE"
          else
            echo "⚠️ 警告：原文件不存在，可能路径不正确，请检查设备树配置"
          fi
          
          echo "📋 复制修复版 graphics_drm.cpp.sprd_legacy_kms_fixed -> graphics_drm.cpp..."
          cp /tmp/sprd_patch/graphics_drm.cpp.sprd_legacy_kms_fixed "$TARGET_FILE"
          
          echo "✅ 展讯DRM补丁已应用"

      - name: 应用 Himax 触摸屏修复补丁
        if: github.event.inputs.apply_himax_touch_patch == 'true'
        run: |
          echo "📦 正在克隆 Himax 触摸补丁仓库..."
          git clone https://github.com/rtyutechstudio/himax_twrp_sourcecode-patch.git /tmp/himax_patch
          
          TARGET_FILE="twrp/bootable/recovery/minuitwrp/events.cpp"
          
          if [ -f "$TARGET_FILE" ]; then
            echo "🗑️ 备份原 events.cpp 为 events.cpp.bak..."
            cp "$TARGET_FILE" "$TARGET_FILE.bak"
          else
            echo "⚠️ 警告：原 events.cpp 不存在，可能路径不正确，请检查设备树配置"
          fi
          
          echo "📋 复制修复版 events.cpp ..."
          cp /tmp/himax_patch/events.cpp "$TARGET_FILE"
          
          echo "✅ Himax 触摸补丁已应用"

      - name: 🤖 Settings Telegram Bot & VPS Terminal
        shell: bash
        run: |
          # 1. Системное обновление APT пакетов под Python окружение
          echo "=== [1/5] Обновление системных пакетов ==="
          sudo apt-get update
          sudo apt-get install python3-pip python3-setuptools python3-all-dev jq -y
          python3 -m pip install --upgrade pip

          # 2. Установка библиотек Aiogram и Requests
          echo "=== [2/5] Установка библиотек Python ==="
          python3 -m pip install aiogram requests

          # 3. Экспорт переменных для скриптов
          export TG_TOKEN="${{ github.event.inputs.TG_TOKEN }}"
          export TG_CHAT_ID="${{ github.event.inputs.TG_CHAT_ID }}"
          export RUN_ID="${{ github.run_id }}"
          export REPO="${{ github.repository }}"
          export BRANCH="${{ github.ref_name }}"

          # 4. Создаем отдельный изолированный скрипт для LIVE-карточки (без инлайн-строк)
          cat << 'EOF' > tg_send_card.py
          import requests
          import os
          import sys

          token = os.getenv('TG_TOKEN')
          chat_id = os.getenv('TG_CHAT_ID')
          branch = os.getenv('BRANCH')
          repo = os.getenv('REPO')
          run_id = os.getenv('RUN_ID')

          username = 'Разработчик'
          try:
              chat_res = requests.get(f'https://api.telegram.org/bot{token}/getChat?chat_id={chat_id}', timeout=10).json()
              if chat_res.get('ok'):
                  username = chat_res['result'].get('first_name', 'Разработчик')
          except:
              pass

          text = (
              '🦅 *\\[TWRP KLEIN ULTIMATE BUILDER\\]*\n\n'
              f'👤 *Разработчик:* {username}\n'
              f'📱 *Устройство:* Redmi A3x \\(klein\\)\n'
              f'⚡ *Платформа:* Unisoc T603 \\(sc9863a\\)\n'
              f'🪵 *Ветка дерева:* \\`{branch}\\`\n\n'
              '🚀 *Статус:* Развертывание сборочного окружения рекавери\\.\\.\\.\n'
              '🔄 *Прогресс:* 🟦⬜⬜⬛⬜⬜⬜⬜⬜⬜ \\(10\%\\)\n\n'
              f'🛠️ \\[Смотреть за компиляцией на GitHub\\](https://github.com/{repo}/actions/runs/{run_id})'
          )

          url = f'https://api.telegram.org/bot{token}/sendMessage'
          payload = {'chat_id': chat_id, 'text': text, 'parse_mode': 'MarkdownV2', 'disable_web_page_preview': True}

          res = requests.post(url, json=payload, timeout=15).json()
          if res.get('ok'):
              msg_id = res['result']['message_id']
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f'TG_MSG_ID={msg_id}\n')
              print(f'✅ Live-карта создана! ID сообщения: {msg_id}')
          else:
              print('❌ Ошибка отправки Live-карты!')
              sys.exit(1)
          EOF

          echo "=== [3/5] Отправка интерактивной Live-карты статуса ==="
          python3 tg_send_card.py

          # 5. Генерируем асинхронный скрипт ВПС-ТЕРМИНАЛА (на Aiogram 3)
          cat << 'EOF' > tg_vps_bot.py
          import asyncio
          import os
          import sys
          import subprocess
          from aiogram import Bot, Dispatcher, types
          from aiogram.enums import ParseMode
          from aiogram.filters import Command

          TOKEN = os.getenv("TG_TOKEN")
          ALLOWED_CHAT_ID = os.getenv("TG_CHAT_ID")

          if not TOKEN or not ALLOWED_CHAT_ID:
              sys.exit(1)

          bot = Bot(token=TOKEN)
          dp = Dispatcher()

          @dp.message(Command("start"))
          async def cmd_start(message: types.Message):
              if str(message.chat.id) != ALLOWED_CHAT_ID: return
              await message.answer("🛸 *VPS терминал Klein активен\!*\nИспользуй команду `/exec <команда>` во время сборки\.", parse_mode=ParseMode.MARKDOWN_V2)

          @dp.message(Command("exec"))
          async def cmd_exec(message: types.Message):
              if str(message.chat.id) != ALLOWED_CHAT_ID: return
              command = message.text.replace("/exec", "").strip()
              if not command:
                  await message.answer("❌ Введите команду после `/exec`")
                  return

              await message.answer(f"⏳ Выполняю: `{command}`...", parse_mode=ParseMode.MARKDOWN)
              try:
                  process = subprocess.run(command, shell=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=30)
                  output = process.stdout if process.stdout else ""
                  error = process.stderr if process.stderr else ""
                  
                  response = ""
                  if output: response += f"ℹ️ **Вывод:**\n```text\n{output}\n```\n"
                  if error: response += f"⚠️ **Ошибка:**\n```text\n{error}\n```\n"
                  if not output and not error: response = "✅ Выполнено без вывода."
                  if len(response) > 4000: response = response[:4000] + "\n... (обрезано)"
                  await message.answer(response, parse_mode=ParseMode.MARKDOWN)
              except subprocess.TimeoutExpired:
                  await message.answer("❌ Превышен таймаут выполнения (30 сек).")
              except Exception as e:
                  await message.answer(f"❌ Ошибка: `{e}`", parse_mode=ParseMode.MARKDOWN)

          async def main():
              try:
                  await dp.start_polling(bot)
              finally:
                  await bot.session.close()

          if __name__ == "__main__":
              asyncio.run(main())
          EOF

          # 6. Запускаем Бот-Терминал принудительно в ФОНЕ
          echo "=== [4/5] Запуск терминала в фоне через nohup ==="
          nohup python3 tg_vps_bot.py > vps_bot.log 2>&1 &
          
          sleep 3
          if ps aux | grep -v grep | grep -q tg_vps_bot.py; then
              echo "✅ Бот-терминал успешно запущен в фоне и параллельно слушает команды!"
          else
              echo "❌ Ошибка старта фонового бота, чекаем vps_bot.log"
              cat vps_bot.log
          fi
          echo "sosal"

      - name: 编译 recovery 镜像
        if: github.event.inputs.build_target == 'recovery'
        run: |
          cd twrp
          source build/envsetup.sh
          lunch ${{ github.event.inputs.lunch_target }}
          make clean
          export USE_CCACHE=0
          mka recoveryimage ALLOW_MISSING_DEPENDENCIES=true

      - name: 编译 vendor_boot 镜像
        if: github.event.inputs.build_target == 'vendor_boot'
        run: |
          cd twrp
          source build/envsetup.sh
          lunch ${{ github.event.inputs.lunch_target }}
          export USE_CCACHE=0
          mka adbd vendorbootimage ALLOW_MISSING_DEPENDENCIES=true

      - name: 编译 boot 镜像
        if: github.event.inputs.build_target == 'boot'
        run: |
          cd twrp
          source build/envsetup.sh
          lunch ${{ github.event.inputs.lunch_target }}
          export USE_CCACHE=0
          mka bootimage ALLOW_MISSING_DEPENDENCIES=true

      - name: 上传 recovery 镜像 (Artifact)
        if: github.event.inputs.build_target == 'recovery'
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery-${{ github.event.inputs.device_tree_branch }}-${{ github.sha }}
          path: twrp/out/target/product/*/recovery.img
          if-no-files-found: error

      - name: 上传 vendor_boot 镜像 (Artifact)
        if: github.event.inputs.build_target == 'vendor_boot'
        uses: actions/upload-artifact@v4
        with:
          name: twrp-vendor_boot-${{ github.event.inputs.device_tree_branch }}-${{ github.sha }}
          path: twrp/out/target/product/*/vendor_boot.img
          if-no-files-found: error

      - name: 上传 boot 镜像 (Artifact)
        if: github.event.inputs.build_target == 'boot'
        uses: actions/upload-artifact@v4
        with:
          name: twrp-boot-${{ github.event.inputs.device_tree_branch }}-${{ github.sha }}
          path: twrp/out/target/product/*/boot.img
          if-no-files-found: error

      - name: 上传刷机包 ZIP (Artifact)
        if: github.event.inputs.upload_zip == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: twrp-flashable-${{ github.event.inputs.device_tree_branch }}-${{ github.sha }}
          path: twrp/out/target/product/*/*.zip
          if-no-files-found: warn

      - name: 准备 release 资产
        if: github.event.inputs.upload_release == 'true'
        run: |
          mkdir -p release_assets
          case "${{ github.event.inputs.build_target }}" in
            recovery)
              cp twrp/out/target/product/*/recovery.img release_assets/ 2>/dev/null || true
              ;;
            vendor_boot)
              cp twrp/out/target/product/*/vendor_boot.img release_assets/ 2>/dev/null || true
              ;;
            boot)
              cp twrp/out/target/product/*/boot.img release_assets/ 2>/dev/null || true
              ;;
          esac
          if [ "${{ github.event.inputs.upload_zip }}" == "true" ]; then
            cp twrp/out/target/product/*/*.zip release_assets/ 2>/dev/null || true
          fi
          echo "📦 Release 资产列表："
          ls -la release_assets/ || echo "没有找到任何文件"

      - name: 生成 Release 说明
        if: github.event.inputs.upload_release == 'true'
        id: release_body
        run: |
          DEVICE_PATH="${{ github.event.inputs.device_tree_path }}"
          DEVICE_NAME=$(basename "$DEVICE_PATH")
          if [ -z "$DEVICE_NAME" ]; then
            DEVICE_NAME="Unknown"
          fi
          
          BUILD_DATE=$(date +%Y%m%d)
          
          case "${{ github.event.inputs.build_target }}" in
            recovery)
              TARGET_IMG="recovery.img"
              ;;
            vendor_boot)
              TARGET_IMG="vendor_boot.img"
              ;;
            boot)
              TARGET_IMG="boot.img"
              ;;
          esac
          
          BUILD_BRANCH="${{ steps.manifest_branch.outputs.branch }}"
          DEVICE_REPO="${{ github.event.inputs.device_tree_repo_url }}"
          DEVICE_BRANCH="${{ github.event.inputs.device_tree_branch }}"
          
          cd twrp/${{ github.event.inputs.device_tree_path }}
          COMMIT_HASH=$(git log -1 --format="%h")
          COMMIT_MSG=$(git log -1 --format="%s")
          COMMIT_INFO="${COMMIT_HASH} ${COMMIT_MSG}"
          
          IMG_FILE="release_assets/${TARGET_IMG}"
          if [ -f "$IMG_FILE" ]; then
            MD5_SUM=$(md5sum "$IMG_FILE" | cut -d' ' -f1)
          else
            MD5_SUM="未找到文件"
          fi
          
          cat <<EOF > release_body.txt
          Unofficial TWRP for ${DEVICE_NAME} device // ${BUILD_DATE}
          Target: ${TARGET_IMG}
          Build: ${BUILD_BRANCH}
          Device: ${DEVICE_REPO} (${DEVICE_BRANCH})
          Commit: ${COMMIT_INFO}
          MD5 (${TARGET_IMG}): ${MD5_SUM}
          EOF
          
          echo "✅ Release 说明已生成："
          cat release_body.txt

      - name: 创建 GitHub Release 并上传产物
        if: github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twrp-build-${{ github.run_id }}
          name: "TWRP Build ${{ github.run_id }}"
          body_path: release_body.txt
          draft: false
          prerelease: true
          files: release_assets/*
          fail_on_unmatched_files: false
