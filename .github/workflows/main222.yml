name: Custom TWRP Builder (with Branch Selector)

on:
  workflow_dispatch:
    inputs:
      # --- Manifest repository selection ---
      manifest_repo_url:
        description: 'TWRP manifest repository URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git'
        type: choice
        options:
          - https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
          - https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git

      # --- Branch selection (preset + custom) ---
      manifest_branch_preset:
        description: 'Select a common manifest branch (choose "custom" to enter your own)'
        required: true
        default: 'twrp-10.0-deprecated'
        type: choice
        options:
          # Omni repo common branches
          - twrp-10.0-deprecated
          - twrp-9.0
          - twrp-8.1
          - twrp-7.1
          - twrp-6.0
          - twrp-5.1
          - twrp-4.4-deprecated
          # AOSP repo common branches
          - twrp-14.1
          - twrp-14
          - twrp-12.1
          - twrp-11
          # Custom option
          - custom

      manifest_branch_custom:
        description: 'If you selected "custom" above, enter your own branch name here'
        required: false
        default: ''

      # --- Device tree configuration ---
      device_tree_repo_url:
        description: 'Device tree GitHub repository URL'
        required: true
        default: 'https://github.com/simonsmh/android_device_xiaomi_umi'
        type: string
      device_tree_branch:
        description: 'Device tree branch'
        required: true
        default: 'android-11.0-new'
        type: string
      device_tree_path:
        description: 'Path where the device tree will be placed in the source tree'
        required: true
        default: 'device/xiaomi/umi'
        type: string

      # --- Build target ---
      lunch_target:
        description: 'lunch target (e.g., omni_umi-eng)'
        required: true
        default: 'omni_umi-eng'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-twrp-${{ github.event.inputs.device_tree_branch }}-${{ github.run_id }}
          max-size: 5G

      - name: Determine final manifest branch
        id: manifest_branch
        run: |
          if [[ "${{ github.event.inputs.manifest_branch_preset }}" == "custom" ]]; then
            BRANCH="${{ github.event.inputs.manifest_branch_custom }}"
            if [[ -z "$BRANCH" ]]; then
              echo "Error: 'custom' selected but no custom branch provided."
              exit 1
            fi
          else
            BRANCH="${{ github.event.inputs.manifest_branch_preset }}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Using manifest branch: $BRANCH"

      - name: Initialize repo
        run: |
          mkdir -p twrp
          cd twrp
          repo init -u "${{ github.event.inputs.manifest_repo_url }}" \
            -b "${{ steps.manifest_branch.outputs.branch }}" --depth=1

      - name: Add custom device tree via local manifest
        run: |
          cd twrp
          mkdir -p .repo/local_manifests
          REPO_NAME=$(basename "${{ github.event.inputs.device_tree_repo_url }}" .git)
          cat > .repo/local_manifests/custom_device.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="${{ github.event.inputs.device_tree_path }}" 
                     name="$REPO_NAME" 
                     remote="custom" 
                     revision="${{ github.event.inputs.device_tree_branch }}" />
          </manifest>
          EOF
          git config -f .repo/manifests/.git/config --add remote.custom.url "${{ github.event.inputs.device_tree_repo_url }}"

      - name: Sync source
        run: |
          cd twrp
          repo sync --force-sync --no-tags --no-clone-bundle -j$(nproc)

      - name: Build recovery image
        run: |
          cd twrp
          source build/envsetup.sh
          lunch ${{ github.event.inputs.lunch_target }}
          mka recoveryimage ALLOW_MISSING_DEPENDENCIES=true || mka recoveryimage
        env:
          CCACHE_EXEC: /usr/bin/ccache
          USE_CCACHE: 1
          CCACHE_DIR: /home/runner/.ccache

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ github.event.inputs.device_tree_branch }}-${{ github.sha }}
          path: twrp/out/target/product/*/recovery.img
          if-no-files-found: error
